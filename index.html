<!doctype html>
<html lang="ko">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한국 규제와 제품 연결</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: cubig.ai home language — centered hero, alternating white / lavender sections, list → detail pages. Single light theme, matching cubig.ai. */
:root{
  color-scheme:light;
  --ink:#1c1c1c; --body:rgba(28,28,28,.80); --muted:#5f5f5d; --faint:#8d8c88;
  --bg:#ffffff; --alt:#f8f7fc; --tint:#f4f2ff; --foot:#fafaf9;
  --line:rgba(28,28,28,.09); --line2:rgba(28,28,28,.16);
  --purple:#8a77e0; --purple-ink:#6f50cc; --purple-soft:rgba(138,119,224,.12);
  --syn:#0f7f74; --syn-bg:#e5f4f1; --dts:#b85a17; --dts-bg:#fbeee3;
  --risk:#b4650f; --risk-bg:#fdf3e4;
  --ok:#1d7a50; --ok-bg:#e6f4ec; --plan:#2a62c2; --plan-bg:#e8effb;
  --delay:#9a6410; --delay-bg:#fbf2dd; --pend:#5f5f6e; --pend-bg:#eeeef2;
  --f:"Manrope","Noto Sans KR",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --w:1216px;
}
*{box-sizing:border-box}
html{scroll-padding-top:88px}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:6px}
.wrap{max-width:calc(var(--w) + 64px);margin:0 auto;padding-inline:32px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--tint);color:var(--purple-ink);flex:none}
.ico svg.i{width:20px;height:20px}
.ico.sm{width:30px;height:30px;border-radius:8px}
.ico.sm svg.i{width:16px;height:16px}
.ico.risk{background:var(--risk-bg);color:var(--risk)}
.ico.ok{background:var(--ok-bg);color:var(--ok)}
.ico.syntitan{background:var(--syn-bg);color:var(--syn)}
.ico.dts{background:var(--dts-bg);color:var(--dts)}
.ico.grey{background:var(--alt);color:var(--muted)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:24px;height:64px}
.logo{display:flex;align-items:center;gap:12px;white-space:nowrap}
.logo b{font-weight:600;letter-spacing:.32em;font-size:15px}
.logo span{font-size:13px;color:var(--muted);padding-left:12px;border-left:1px solid var(--line2)}
.menu{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.menu a{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:14.5px;font-weight:500;color:var(--muted);border-radius:8px;white-space:nowrap}
.menu a svg.i{width:16px;height:16px}
.menu a:hover{color:var(--ink);background:var(--alt)}
.menu a.on{color:var(--purple-ink);background:var(--tint);font-weight:700}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.gsearch{position:relative;width:250px}
.gsearch input{width:100%;height:38px;border:1px solid var(--line2);border-radius:8px;padding:0 12px 0 36px;font-size:14px;background:#fff}
.gsearch input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-soft)}
.gsearch > svg.i{position:absolute;left:11px;top:10px;width:17px;height:17px;color:var(--faint)}
.results{position:absolute;right:0;top:46px;width:min(520px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(28,28,28,.12);padding:8px}
.results h4{margin:10px 10px 4px;font-size:12px;font-weight:600;color:var(--purple-ink);letter-spacing:.04em}
.results a{display:block;padding:8px 10px;border-radius:8px;font-size:14px}
.results a:hover,.results a:focus{background:var(--alt)}
.results a small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .none{padding:14px 10px;color:var(--muted);font-size:14px}
.lang{display:flex;border:1px solid var(--line2);border-radius:8px;padding:3px;gap:2px;background:#fff}
.lang button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* type */
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--purple-ink);margin:0 0 14px}
.pill-eb{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--purple);background:var(--purple-soft);padding:8px 20px;border-radius:999px;margin:0 0 26px}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--ink)}
.h2{font-size:clamp(26px,3.2vw,36px);font-weight:600;letter-spacing:-.035em;line-height:1.28}
.lead{font-size:17px;line-height:1.7;color:var(--body);max-width:62ch;margin:14px 0 0}
section.sec{padding-block:clamp(56px,8vw,84px)}
section.alt{background:var(--alt)}
.sec-h{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:34px}
.more{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--purple-ink);white-space:nowrap}
.more:hover{text-decoration:underline}
.more svg.i{width:16px;height:16px}

/* buttons */
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:8px;font-size:15px;font-weight:600}
.btn svg.i{width:17px;height:17px}
.btn.p{background:var(--purple);color:#fff}
.btn.p:hover{background:#7a66d6}
.btn.k{background:var(--ink);color:#fcfbf8;border-radius:6px}
.btn.k:hover{background:#000}

/* hero */
.hero{text-align:center;padding-block:clamp(64px,10vw,104px) clamp(48px,7vw,72px)}
.hero h1{font-size:clamp(34px,5.6vw,56px);font-weight:700;letter-spacing:-.04em;line-height:1.16}
.hero h1 em{font-style:normal;color:var(--purple);display:block}
.hero .lead{margin:22px auto 34px;text-align:center}
.hero .fine{font-size:13.5px;color:var(--faint);margin:16px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;margin-top:56px;overflow:hidden;background:#fff;text-align:left}
.stat{padding:22px 24px;display:flex;gap:14px;align-items:center}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
a.stat:hover{background:var(--alt)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px 24px;display:grid;gap:12px;align-content:start}
.step .row{display:flex;justify-content:space-between;align-items:center}
.step .no{font-family:var(--mono);font-size:13px;color:var(--faint)}
.step h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.step p{margin:0;color:var(--body);font-size:15px;line-height:1.6}

/* filter toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;padding:16px 20px;background:var(--alt);border:1px solid var(--line);border-radius:14px;margin-bottom:22px}
.tgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tlabel{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.chip svg.i{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.tsearch{position:relative;flex:1 1 280px;max-width:420px}
.tsearch input{width:100%;height:42px;border:1px solid var(--line2);border-radius:10px;padding:0 14px 0 38px;font-size:15px;background:#fff}
.tsearch input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-soft)}
.tsearch svg.i{position:absolute;left:12px;top:12px;color:var(--faint)}
select.sel{height:42px;border:1px solid var(--line2);border-radius:10px;padding:0 32px 0 12px;font-size:14px;background:#fff;max-width:100%;min-width:0;cursor:pointer}
.resbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;font-size:14px;color:var(--muted)}
.reset{border:0;background:none;color:var(--purple-ink);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;padding:4px}
.reset:hover{text-decoration:underline}

/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:6px;white-space:nowrap}
.tag svg.i{width:14px;height:14px}
.tag.capsule{color:var(--purple-ink);background:var(--tint)}
.tag.syntitan{color:var(--syn);background:var(--syn-bg)}
.tag.dts{color:var(--dts);background:var(--dts-bg)}
a.tag:hover{filter:brightness(.96)}
.st{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-시행{color:var(--ok);background:var(--ok-bg)} .s-시행예정{color:var(--plan);background:var(--plan-bg)}
.s-연기{color:var(--delay);background:var(--delay-bg)} .s-계류,.s-초안{color:var(--pend);background:var(--pend-bg)}
.kind{font-size:12.5px;color:var(--muted);border:1px solid var(--line2);padding:1px 8px;border-radius:5px;white-space:nowrap}
.num{font-family:var(--mono);font-size:13px;color:var(--faint)}
.cno{display:inline-flex;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line2);border-radius:6px;padding:1px 7px;color:var(--muted);background:#fff}
a.cno:hover{border-color:var(--purple);color:var(--purple-ink)}
.cnos{display:inline-flex;gap:4px;flex-wrap:wrap}

/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 24px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:border-color .15s,box-shadow .15s,transform .15s}
a.card:hover{border-color:var(--purple);box-shadow:0 10px 28px rgba(111,80,204,.10);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.card .top .who{display:flex;align-items:center;gap:10px;font-weight:600}
.card h3{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.45}
.card .tags{display:flex;gap:6px;flex-wrap:wrap}
.card .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);gap:10px}
.card .foot span{display:inline-flex;align-items:center;gap:6px}
.card .foot svg.i{width:15px;height:15px}
.card .go{color:var(--purple-ink);font-weight:600}
.card p.snip{margin:0;color:var(--body);font-size:15px;line-height:1.6}

/* product cards */
.prod{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 28px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.prod .hd{display:flex;align-items:center;gap:14px}
.prod h3{font-size:24px;font-weight:700;letter-spacing:-.03em}
.prod ol{margin:0;padding:0;list-style:none}
.prod ol a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15.5px;font-weight:500}
.prod ol a:hover{color:var(--purple-ink)}
.prod ol a svg.i{width:16px;height:16px;color:var(--faint)}
.prod .foot{margin-top:auto;font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* timeline */
.tl{border-top:1px solid var(--line)}
.tl-row{display:grid;grid-template-columns:170px 1fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
.tl-date{display:flex;gap:12px;align-items:flex-start}
.tl-date b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.3}
.tl-date small{font-size:13px;color:var(--muted)}
.tl-items{display:grid;gap:10px;align-content:center}
.tl-item{display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap;font-size:15.5px}
.tl-item:hover .t{color:var(--purple-ink);text-decoration:underline}
.tl-item .t{font-weight:600}
.tl-item .l{color:var(--muted);font-size:14px}

/* page header */
.ph{background:var(--alt);padding-block:48px 44px;border-bottom:1px solid var(--line)}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.crumb a{display:inline-flex;gap:6px;align-items:center}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.crumb svg.i{width:15px;height:15px}
.ph-row{display:flex;gap:20px;align-items:flex-start}
.ph h1{font-size:clamp(26px,3.6vw,40px);font-weight:700;letter-spacing:-.035em;line-height:1.3;max-width:30ch}
.ph .sub{font-size:15px;color:var(--muted);margin:10px 0 0;max-width:70ch}
.ph .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px}
.ph .ico{width:52px;height:52px;border-radius:14px}
.ph .ico svg.i{width:24px;height:24px}

/* detail layout */
.detail{display:grid;grid-template-columns:230px minmax(0,1fr);gap:56px;padding-block:48px 80px}
.toc{position:sticky;top:96px;align-self:start;display:grid;gap:2px;font-size:14px}
.toc b{font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);margin:14px 0 6px;text-transform:uppercase}
.toc b:first-child{margin-top:0}
.toc a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--muted)}
.toc a svg.i{width:15px;height:15px}
.toc a:hover{color:var(--ink);background:var(--alt)}
.toc a.on{color:var(--purple-ink);background:var(--tint);font-weight:600}
.dbody{max-width:800px;display:grid;gap:28px}
.panel{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:14px;padding:20px 28px;border-bottom:1px solid var(--line);background:var(--alt)}
.panel-h h2{font-size:20px;font-weight:700;letter-spacing:-.025em}
.panel-h p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.panel-b{padding:8px 28px}
.blk{display:grid;gap:14px;padding:24px 0}
.blk + .blk{border-top:1px solid var(--line)}
.blk h3{font-size:17px;font-weight:700;letter-spacing:-.015em;display:flex;gap:10px;align-items:center}
.blk h3 .n{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--faint);border:1px solid var(--line2);border-radius:5px;padding:0 6px}
ul.b{margin:0;padding:0;list-style:none;display:grid;gap:9px}
ul.b li{position:relative;padding-left:20px;font-size:16.5px;line-height:1.7;color:var(--body)}
ul.b li::before{content:"";position:absolute;left:3px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--purple);opacity:.6}
ul.b.sm li{font-size:15px;line-height:1.65}
.risk ul.b li::before{background:var(--risk)}
.box{background:var(--tint);border-radius:18px;padding:26px 30px;display:grid;gap:16px}
.box .bh{display:flex;align-items:center;gap:12px}
.box .bh h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.box ul.b li{color:var(--ink)}
.box ul.b li::before{opacity:1}
.lawcards{display:grid;gap:8px}
.lawcard{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 18px;background:#fff;transition:border-color .15s,background .15s}
.lawcard:hover{border-color:var(--purple);background:var(--alt)}
.lawcard .tx{flex:1;min-width:0;display:grid;gap:2px}
.lawcard b{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.lawcard span{color:var(--muted);font-size:14.5px}
.lawcard > svg.i{color:var(--purple-ink)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lk{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:14.5px;font-weight:600;background:#fff}
.lk:hover{border-color:var(--purple);color:var(--purple-ink)}
.lk svg.i{width:15px;height:15px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pn a{border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:grid;gap:4px;min-width:0}
.pn a:hover{border-color:var(--purple)}
.pn small{font-size:13px;color:var(--muted)}
.pn b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn .r{text-align:right}
.mini{display:grid;gap:8px}
.mini a{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.mini a:hover{border-color:var(--purple)}
.mini b{font-size:15px;font-weight:600;flex:1;min-width:0}
.mini small{color:var(--muted);font-size:13px}

/* feature rows */
.feats{display:grid;gap:16px}
.feat{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.feat-h{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:20px 28px;border-bottom:1px solid var(--line)}
.feat-h h3{font-size:19px;font-weight:700;letter-spacing:-.02em}
.feat-h .meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.feat-h a.src{display:inline-flex;gap:5px;align-items:center;color:var(--purple-ink);font-weight:600}
.feat-b{display:grid;grid-template-columns:1fr 1fr;gap:0}
.feat-b > div{padding:22px 28px;display:grid;gap:20px;align-content:start;min-width:0}
.feat-b > div + div{border-left:1px solid var(--line);background:#fcfbfe}
.lab{display:flex;gap:7px;align-items:center;font-size:13.5px;font-weight:700;color:var(--ink);margin:0 0 10px}
.lab svg.i{width:15px;height:15px;color:var(--purple-ink)}
.reflist{display:grid;gap:6px}
.reflist a{display:inline-flex;gap:6px;align-items:center;font-size:15px;font-weight:600;color:var(--purple-ink)}
.reflist a:hover{text-decoration:underline}
.reflist a svg.i{width:14px;height:14px}

/* sources */
.sgroup{margin-bottom:28px}
.sgroup-h{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1.5px solid var(--ink)}
.sgroup-h h3{font-size:16px;font-weight:700;letter-spacing:-.01em;flex:1 1 300px}
.sgroup-h .c{font-size:13px;color:var(--muted)}
.srow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:6px 20px;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line);border-radius:0}
.srow:hover{background:var(--alt)}
.srow:hover .a{color:var(--purple-ink)}
.srow .a{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.srow .m{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.srow .d{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:86px;text-align:right}
.texts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.texts.one{grid-template-columns:1fr}
.text{border:1px solid var(--line);border-radius:16px;padding:22px 26px;background:#fff;min-width:0}
.text p{margin:0;white-space:pre-line;font-size:16px;line-height:1.8;color:var(--body)}
.text.en p{font-family:Georgia,"Times New Roman",serif;font-size:16.5px;color:var(--ink)}
.empty{padding:48px 0;color:var(--muted);text-align:center;font-size:16px}

.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--purple)}100%{box-shadow:0 0 0 0 rgba(138,119,224,0)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}*{transition:none!important}}

footer{background:var(--foot);border-top:1px solid var(--line);padding-block:36px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:1100px){
  .grid3{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .detail{grid-template-columns:1fr;gap:28px}
  .toc{display:none}
  .gsearch{width:190px}
  .logo span{display:none}
}
@media (max-width:760px){
  .wrap{padding-inline:16px}
  .nav-in{height:auto;flex-wrap:wrap;gap:6px 10px;padding-block:10px}
  .tools{flex:1 1 auto}
  .gsearch{width:auto;flex:1 1 140px}
  .menu{order:3;flex-basis:100%;margin-inline:-8px}
  .grid3,.grid2,.steps,.texts,.pn,.feat-b{grid-template-columns:1fr}
  .feat-b > div + div{border-left:0;border-top:1px solid var(--line)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .stat{padding:18px 16px}
  .tl-row{grid-template-columns:1fr;gap:10px}
  .srow{grid-template-columns:1fr;gap:4px}
  .srow .m{justify-content:flex-start}
  .srow .d{text-align:left;min-width:0}
  .card,.prod{padding:20px}
  .panel-h,.panel-b,.feat-h,.feat-b > div{padding-inline:18px}
  .box{padding:22px 20px}
  .ph-row .ico{display:none}
  ul.b li{font-size:16px}
  .toolbar{padding:14px}
}

.srow .uv.now{color:var(--purple);background:var(--purple-soft);border-color:transparent;font-weight:600}
.hero .lead{max-width:none;text-wrap:balance}

.hero .fine span{display:block}

.s-계도기간{color:var(--delay);background:var(--delay-bg)}
.s-검증필요{color:var(--risk);background:var(--risk-bg)}
.s-출시예정{color:var(--plan);background:var(--plan-bg);font-size:11.5px;vertical-align:middle;margin-left:4px}
.s-확인필요{color:var(--risk);background:var(--risk-bg);font-size:11.5px;vertical-align:middle;margin-left:4px}
.upnote{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.verbtn{border:0;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.verbtn:hover{text-decoration:underline;text-underline-offset:3px}
.vnew{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--purple);border-radius:999px;padding:2px 7px}

.dtbl thead th{background:var(--bg);font-weight:600;white-space:nowrap}
.dtbl tbody th{font-weight:600;white-space:nowrap}

, "ko": "제3조(개인정보 보호 원칙) ① 개인정보처리자는 개인정보의 처리 목적을 명확하게 하여야 하고 그 목적에 필요한 범위에서 최소한의 개인정보만을 적법하고 정당하게 수집하여야 한다.\n② 개인정보처리자는 개인정보의 처리 목적에 필요한 범위에서 적합하게 개인정보를 처리하여야 하며, 그 목적 외의 용도로 활용하여서는 아니 된다.", "req": ["처리 목적을 명확히 정하기", "목적에 필요한 최소한만 수집하기", "목적 외 용도로 활용하지 않기"], "ctx": ["LLM에 넣는 데이터에도 최소 수집 원칙을 적용하기", "업무에 필요 없는 개인정보는 프롬프트에 넣지 않기", "원본 대신 치환 데이터나 합성 데이터를 쓰는 근거로 삼기"], "change": [], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제3조"}], "clause": "clause:k1", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제3조제1항, 제2항"}, {"id": "KR-P-02", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제15조제3항", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제15조(개인정보의 수집ㆍ이용)\n③ 개인정보처리자는 당초 수집 목적과 합리적으로 관련된 범위에서 정보주체에게 불이익이 발생하는지 여부, 암호화 등 안전성 확보에 필요한 조치를 하였는지 여부 등을 고려하여 대통령령으로 정하는 바에 따라 정보주체의 동의 없이 개인정보를 이용할 수 있다.", "req": ["당초 수집 목적과 합리적으로 관련되는지 고려", "정보주체에게 불이익이 생기는지 고려", "암호화 등 안전조치를 했는지 고려"], "ctx": ["보유 데이터를 AI 학습에 쓸 때 검토하는 근거", "LLM 서비스 운영자가 이용자 프롬프트를 성능 개선 학습에 쓴 사안(옵트아웃 고지와 식별정보 필터링이 조건, 결정례 제2025-011-031호). 일반 보유 데이터 학습은 네 가지 고려사항을 따로 판단", "가명처리 특례(제28조의2)와는 별개인 경로", "2027-03-09부터 원본 활용 특례(제28조의12)가 신설됨. 익명이나 가명으로는 개발이 어렵다는 점을 입증하고 위원회 심의와 의결을 거쳐야 함"], "change": ["2020. 2. 4. 신설"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제15조"}], "clause": "clause:k2", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.1", "verKind": "수정", "clauseName": "개인정보 보호법 제15조제3항, 시행령 제14조의2"}, {"id": "KR-P-03", "region": "개인정보", "law": "개인정보 보호법 시행령(대통령령 제36671호, 2026. 9. 10. 일부개정)", "article": "시행령 제14조의2제1항", "type": "시행령", "status": "시행", "date": "2026-09-11", "ko": "제14조의2(개인정보의 추가적인 이용ㆍ제공의 기준 등) ① 개인정보처리자는 법 제15조제3항 또는 제17조제4항에 따라 정보주체의 동의 없이 개인정보를 이용 또는 제공(이하 “개인정보의 추가적인 이용 또는 제공”이라 한다)하려는 경우에는 다음 각 호의 사항을 고려해야 한다.\n1. 당초 수집 목적과 관련성이 있는지 여부\n2. 개인정보를 수집한 정황 또는 처리 관행에 비추어 볼 때 개인정보의 추가적인 이용 또는 제공에 대한 예측 가능성이 있는지 여부\n3. 정보주체의 이익을 부당하게 침해하는지 여부\n4. 가명처리 또는 암호화 등 안전성 확보에 필요한 조치를 하였는지 여부", "req": ["당초 목적과 관련이 있는지 판단", "추가 이용을 예측할 수 있는지 판단", "가명처리나 암호화 조치를 했는지 판단"], "ctx": ["네 가지 고려사항을 모두 문서로 남겨야 방어할 수 있음", "가명처리와 암호화가 추가 이용의 판단 요소로 명시돼 있음", "계속 이용하면 제2항에 따라 처리방침에 판단 기준을 공개해야 함"], "change": ["2023. 9. 12. 제2항 개정(처리방침 공개, CPO 점검)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법시행령/제14조의2"}], "clause": "clause:k2", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제15조제3항, 시행령 제14조의2"}, {"id": "KR-P-04", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제2조제1호 다목·제1호의2", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다.\n1. “개인정보”란 살아 있는 개인에 관한 정보로서 다음 각 목의 어느 하나에 해당하는 정보를 말한다.\n다. 가목 또는 나목을 제1호의2에 따라 가명처리함으로써 원래의 상태로 복원하기 위한 추가 정보의 사용ㆍ결합 없이는 특정 개인을 알아볼 수 없는 정보(이하 “가명정보”라 한다)\n1의2. “가명처리”란 개인정보의 일부를 삭제하거나 일부 또는 전부를 대체하는 등의 방법으로 추가 정보가 없이는 특정 개인을 알아볼 수 없도록 처리하는 것을 말한다.", "req": ["가명정보도 개인정보에 포함", "추가 정보 없이는 특정 개인을 알아볼 수 없게 처리", "일부 삭제, 대체 등의 방법으로 처리"], "ctx": ["복원 가능한 치환(대응표 보유)은 익명처리가 아니라 가명처리", "가명정보에도 법 전반의 의무가 계속 적용", "LLM 입력을 치환한 결과물의 법적 분류 기준"], "change": ["2020. 2. 4. 데이터 3법 개정으로 신설"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제2조"}], "clause": "clause:k3", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제2조제1호의2, 제28조의2, 제28조의4"}, {"id": "KR-P-05", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제28조의2", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제28조의2(가명정보의 처리 등) ① 개인정보처리자는 통계작성, 과학적 연구, 공익적 기록보존 등을 위하여 정보주체의 동의 없이 가명정보를 처리할 수 있다.\n② 개인정보처리자는 제1항에 따라 가명정보를 제3자에게 제공하는 경우에는 특정 개인을 알아보기 위하여 사용될 수 있는 정보를 포함해서는 아니 된다.", "req": ["통계작성, 과학적 연구, 공익적 기록보존 목적으로 한정", "정보주체의 동의 없이 가명정보 처리 허용", "제3자 제공 시 개인을 알아보는 데 쓰일 수 있는 정보 포함 금지"], "ctx": ["일반 업무 효율화(요약, 질의응답)는 특례 목적이 아님", "특례 밖의 치환은 제29조 안전조치 수단으로 봄", "가이드라인은 \"AI 학습\"처럼 추상적인 목적은 정할 수 없다고 안내함", "2027-03-09부터 원본 활용 특례(제28조의12)가 신설됨. 익명이나 가명으로는 개발이 어렵다는 점을 입증하고 위원회 심의와 의결을 거쳐야 함"], "change": ["2020. 2. 4. 신설"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제28조의2"}], "clause": "clause:k3", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.1", "verKind": "수정", "clauseName": "개인정보 보호법 제2조제1호의2, 제28조의2, 제28조의4"}, {"id": "KR-P-06", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제28조의4제1항", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제28조의4(가명정보에 대한 안전조치의무 등) ① 개인정보처리자는 제28조의2 또는 제28조의3에 따라 가명정보를 처리하는 경우에는 원래의 상태로 복원하기 위한 추가 정보를 별도로 분리하여 보관ㆍ관리하는 등 해당 정보가 유출등이 되지 아니하도록 대통령령으로 정하는 바에 따라 안전성 확보에 필요한 기술적ㆍ관리적 및 물리적 조치를 하여야 한다.", "req": ["추가 정보를 따로 분리해 보관, 관리", "기술적·관리적·물리적 안전조치", "유출등 방지"], "ctx": ["치환 대응표와 복원키가 곧 추가 정보", "원 데이터와 같은 인프라에 보관하면 분리 원칙과 충돌", "조문상 제28조의2, 제28조의3에 따른 처리에만 적용"], "change": ["2026. 3. 10. 개정(시행 2026. 9. 11.), \"유출등\" 용어로 정비"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제28조의4"}], "clause": "clause:k3", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제2조제1호의2, 제28조의2, 제28조의4"}, {"id": "KR-P-07", "region": "개인정보", "law": "개인정보 보호법 시행령(대통령령 제36671호, 2026. 9. 10. 일부개정)", "article": "시행령 제29조의5제1항", "type": "시행령", "status": "시행", "date": "2026-09-11", "ko": "제29조의5(가명정보에 대한 안전성 확보 조치) ① 개인정보처리자는 법 제28조의4제1항에 따라 가명정보 및 가명정보를 원래의 상태로 복원하기 위한 추가 정보(이하 이 조에서 “추가정보”라 한다)에 대하여 다음 각 호의 안전성 확보 조치를 해야 한다.\n1. 제30조에 따른 안전성 확보 조치\n2. 가명정보와 추가정보의 분리 보관. 다만, 추가정보가 불필요한 경우에는 추가정보를 파기해야 한다.\n3. 가명정보와 추가정보에 대한 접근 권한의 분리. 다만, 「소상공인기본법」 제2조에 따른 소상공인으로서 가명정보를 취급할 자를 추가로 둘 여력이 없는 경우 등 접근 권한의 분리가 어려운 정당한 사유가 있는 경우에는 업무 수행에 필요한 최소한의 접근 권한만 부여하고 접근 권한의 보유 현황을 기록으로 보관하는 등 접근 권한을 관리ㆍ통제해야 한다.", "req": ["제30조 안전성 확보조치 적용", "가명정보와 추가정보를 분리해 보관", "접근 권한 분리"], "ctx": ["추가정보가 필요 없게 되면 파기해야 함", "소상공인 등은 최소 권한 부여로 갈음할 수 있음", "대응표를 설계할 때 저장 위치와 권한을 따로 나눠야 함"], "change": ["2023. 9. 12. 개정"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법시행령/제29조의5"}], "clause": "clause:k3", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제2조제1호의2, 제28조의2, 제28조의4"}, {"id": "KR-P-08", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제58조의2", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제58조의2(적용제외) 이 법은 시간ㆍ비용ㆍ기술 등을 합리적으로 고려할 때 다른 정보를 사용하여도 더 이상 개인을 알아볼 수 없는 정보에는 적용하지 아니한다.", "req": ["시간, 비용, 기술을 합리적으로 고려해야 함", "다른 정보를 사용해도 개인을 알아볼 수 없어야 함", "해당하는 정보에는 법을 적용하지 않음"], "ctx": ["익명정보인지 판단하는 기준이 됨", "합성데이터가 익명정보로 인정되면 법이 적용되지 않음", "복원 수단이 남아 있으면 해당하지 않음"], "change": ["2020. 2. 4. 신설"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제58조의2"}], "clause": "clause:k4", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제58조의2"}, {"id": "KR-P-09", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제29조", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제29조(안전조치의무) 개인정보처리자는 개인정보가 유출등이 되지 아니하도록 내부 관리계획 수립, 접속기록 보관 등 대통령령으로 정하는 바에 따라 안전성 확보에 필요한 기술적ㆍ관리적 및 물리적 조치를 하여야 한다.", "req": ["내부 관리계획 수립", "접속기록 보관", "기술적·관리적·물리적 안전조치"], "ctx": ["LLM이나 RAG 색인도 개인정보처리시스템이면 적용됨", "입력 치환과 마스킹은 이 의무의 이행 수단으로 설명할 수 있음", "제64조의2제1항제9호 단서: 안전조치를 다하면 유출 과징금 면제", "2027-07-01부터 매출액과 처리 규모 기준에 해당하는 처리자는 ISMS-P 인증 의무(제32조의2제1항 단서)"], "change": ["2026. 3. 10. 개정(시행 2026. 9. 11.), \"유출등\" 용어로 정비"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제29조"}], "clause": "clause:k5", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.1", "verKind": "수정", "clauseName": "개인정보 보호법 제29조, 안전성 확보조치 기준"}, {"id": "KR-P-10", "region": "개인정보", "law": "개인정보의 안전성 확보조치 기준(개인정보보호위원회고시 제2026-9호, 2026. 7. 1. 일부개정)", "article": "제5조(접근 권한의 관리) 제1항·제3항", "type": "고시", "status": "시행", "date": "2026-07-01", "ko": "제5조(접근 권한의 관리) ① 개인정보처리자는 개인정보처리시스템에 대한 접근 권한을 업무 수행에 필요한 최소한의 범위로 차등 부여하여야 한다.\n③ 개인정보처리자는 제1항 및 제2항에 의한 권한 부여, 변경 또는 말소에 대한 내역을 기록하고, 그 기록을 최소 3년간 보관하여야 한다.", "req": ["업무에 필요한 최소 범위로 차등 부여", "부여, 변경, 말소 내역 기록", "기록은 최소 3년 보관"], "ctx": ["AI 서비스 관리자 권한과 지식베이스 공개 범위에도 적용", "대응표 접근 권한 이력도 3년 보관 대상"], "change": ["2026. 7. 1. 일부개정(제2026-9호)", "제5조①⑥, 제6조②, 제8조①②는 제2025-9호(2025-10-31) 부칙에 따라 2026-11-01 시행(인용 문언이 이 개정분)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/행정규칙/개인정보의안전성확보조치기준"}], "clause": "clause:k5", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.2", "verKind": "수정", "clauseName": "개인정보 보호법 제29조, 안전성 확보조치 기준"}, {"id": "KR-P-11", "region": "개인정보", "law": "개인정보의 안전성 확보조치 기준(개인정보보호위원회고시 제2026-9호, 2026. 7. 1. 일부개정)", "article": "제6조(접근통제) 제1항", "type": "고시", "status": "시행", "date": "2026-07-01", "ko": "제6조(접근통제) ① 개인정보처리자는 정보통신망을 통한 불법적인 접근 및 침해사고 방지를 위해 다음 각 호의 안전조치를 하여야 한다.\n1. 개인정보처리시스템에 대한 접속 권한을 인터넷 프로토콜(IP) 주소 등으로 제한하여 인가받지 않은 접근을 제한\n2. 개인정보처리시스템에 접속한 인터넷 프로토콜(IP) 주소 등을 분석하여 개인정보 유출 시도 탐지 및 대응", "req": ["IP 주소 등으로 접속 권한 제한", "유출 시도를 탐지하고 대응"], "ctx": ["외부 LLM API 호출도 통제 대상", "제2항: 외부에서 접속할 때 안전한 인증수단 적용 의무", "제6조의2 인터넷망 차단 조치는 취급자 PC에서 외부 LLM을 쓰는 구조와 부딪힐 수 있음"], "change": ["2026. 7. 1. 일부개정(제2026-9호)", "제6조의2 인터넷망 차단 조치는 제2025-9호(2025-10-31)로 신설, 즉시 시행(100만 이용자 이상 처리자, 위험분석 기반 예외)", "제5조①⑥, 제6조②, 제8조①②는 제2025-9호(2025-10-31) 부칙에 따라 2026-11-01 시행(인용 문언이 이 개정분)", "제2026-9호(2026-07-01)의 실질 개정은 공공시스템 관련(제15조제5호, 제18조, 2027-01-01 시행)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/행정규칙/개인정보의안전성확보조치기준"}], "clause": "clause:k5", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.2", "verKind": "수정", "clauseName": "개인정보 보호법 제29조, 안전성 확보조치 기준"}, {"id": "KR-P-12", "region": "개인정보", "law": "개인정보의 안전성 확보조치 기준(개인정보보호위원회고시 제2026-9호, 2026. 7. 1. 일부개정)", "article": "제7조(개인정보의 암호화) 제4항(제2항, 제3항은 해설)", "type": "고시", "status": "시행", "date": "2026-07-01", "ko": "제7조(개인정보의 암호화)\n④ 개인정보처리자는 개인정보를 정보통신망을 통하여 인터넷망 구간으로 송ㆍ수신하는 경우에는 이를 안전한 암호 알고리즘으로 암호화하여야 한다.", "req": ["인터넷망으로 송수신할 때 암호화", "안전한 암호 알고리즘 사용"], "ctx": ["외부 LLM으로 보내는 프롬프트에 적용", "제2항: 주민등록번호 등 7종은 저장할 때 암호화", "제6항: 대규모 처리자의 암호 키 관리 절차"], "change": ["2026. 7. 1. 일부개정(제2026-9호)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/행정규칙/개인정보의안전성확보조치기준"}], "clause": "clause:k5", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.2", "verKind": "수정", "clauseName": "개인정보 보호법 제29조, 안전성 확보조치 기준"}, {"id": "KR-P-13", "region": "개인정보", "law": "개인정보의 안전성 확보조치 기준(개인정보보호위원회고시 제2026-9호, 2026. 7. 1. 일부개정)", "article": "제8조(접속기록의 보관 및 점검) 제1항", "type": "고시", "status": "시행", "date": "2026-07-01", "ko": "제8조(접속기록의 보관 및 점검) ① 개인정보처리자는 개인정보처리시스템에 접속한 자(다만, 정보주체는 제외한다)의 접속기록을 1년 이상 보관ㆍ관리하여야 한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 2년 이상 보관ㆍ관리하여야 한다.\n1. 5만명 이상의 정보주체에 관한 개인정보를 처리하는 개인정보처리시스템에 해당하는 경우\n2. 고유식별정보 또는 민감정보를 처리하는 개인정보처리시스템에 해당하는 경우\n3. 개인정보처리자로서 「전기통신사업법」제6조제1항에 따라 등록을 하거나 같은 항 단서에 따라 신고한 기간통신사업자에 해당하는 경우", "req": ["접속기록 1년 이상 보관", "5만 명 이상이거나 민감정보, 고유식별정보를 처리하면 2년 이상"], "ctx": ["AI 서비스의 질의와 처리 기록도 접속기록 관리 대상", "민감정보를 다루는 RAG 색인은 2년 보관"], "change": ["2026. 7. 1. 일부개정(제2026-9호)", "제5조①⑥, 제6조②, 제8조①②는 제2025-9호(2025-10-31) 부칙에 따라 2026-11-01 시행(인용 문언이 이 개정분)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/행정규칙/개인정보의안전성확보조치기준"}], "clause": "clause:k5", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.2", "verKind": "수정", "clauseName": "개인정보 보호법 제29조, 안전성 확보조치 기준"}, {"id": "KR-P-14", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제26조제1항·제4항·제6항", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제26조(업무위탁에 따른 개인정보의 처리 제한) ① 개인정보처리자가 제3자에게 개인정보의 처리 업무를 위탁하는 경우에는 다음 각 호의 내용이 포함된 문서로 하여야 한다.\n1. 위탁업무 수행 목적 외 개인정보의 처리 금지에 관한 사항\n2. 개인정보의 기술적ㆍ관리적 보호조치에 관한 사항\n3. 그 밖에 개인정보의 안전한 관리를 위하여 대통령령으로 정한 사항\n④ 위탁자는 업무 위탁으로 인하여 정보주체의 개인정보가 유출등이 되지 아니하도록 수탁자를 교육하고, 처리 현황 점검 등 대통령령으로 정하는 바에 따라 수탁자가 개인정보를 안전하게 처리하는지를 감독하여야 한다.\n⑥ 수탁자는 위탁받은 개인정보의 처리 업무를 제3자에게 다시 위탁하려는 경우에는 위탁자의 동의를 받아야 한다.", "req": ["위탁할 때 필수 사항을 담은 문서 작성", "수탁자 교육과 처리 현황 감독", "재위탁하려면 위탁자 동의"], "ctx": ["서비스형 LLM 공급자는 보통 수탁자로 계약함", "DPA에 재위탁 통제와 감사권을 명시해야 함", "제8항: 수탁자에게도 제29조, 제64조의2 등을 준용함"], "change": ["2026. 3. 10. 제4항 개정(시행 2026. 9. 11.)", "2023. 3. 14. 제6항 신설"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제26조"}], "clause": "clause:k6", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제26조제1항, 제4항, 제6항"}, {"id": "KR-P-15", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제28조의8제1항", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제28조의8(개인정보의 국외 이전) ① 개인정보처리자는 개인정보를 국외로 제공(조회되는 경우를 포함한다)ㆍ처리위탁ㆍ보관(이하 이 절에서 “이전”이라 한다)하여서는 아니 된다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 개인정보를 국외로 이전할 수 있다.\n1. 정보주체로부터 국외 이전에 관한 별도의 동의를 받은 경우\n2. 법률, 대한민국을 당사자로 하는 조약 또는 그 밖의 국제협정에 개인정보의 국외 이전에 관한 특별한 규정이 있는 경우\n3. 정보주체와의 계약의 체결 및 이행을 위하여 개인정보의 처리위탁ㆍ보관이 필요한 경우로서 다음 각 목의 어느 하나에 해당하는 경우\n가. 제2항 각 호의 사항을 제30조에 따른 개인정보 처리방침에 공개한 경우\n나. 전자우편 등 대통령령으로 정하는 방법에 따라 제2항 각 호의 사항을 정보주체에게 알린 경우\n4. 개인정보를 이전받는 자가 제32조의2에 따른 개인정보 보호 인증 등 보호위원회가 정하여 고시하는 인증을 받은 경우로서 다음 각 목의 조치를 모두 한 경우\n가. 개인정보 보호에 필요한 안전조치 및 정보주체 권리보장에 필요한 조치\n나. 인증받은 사항을 개인정보가 이전되는 국가에서 이행하기 위하여 필요한 조치\n5. 개인정보가 이전되는 국가 또는 국제기구의 개인정보 보호체계, 정보주체 권리보장 범위, 피해구제 절차 등이 이 법에 따른 개인정보 보호 수준과 실질적으로 동등한 수준을 갖추었다고 보호위원회가 인정하는 경우", "req": ["국외 제공, 처리위탁, 보관은 원칙적으로 금지", "예외: 별도 동의, 계약 이행, 인증, 적정성 등", "조회되는 경우도 이전에 포함"], "ctx": ["해외 리전 LLM API를 호출하면 국외이전 검토 대상", "제3호는 처리방침 공개나 개별 고지가 필요", "치환 결과도 가명정보라 이전 규율은 그대로 적용됨. 치환은 이전되는 범위와 위험을 줄이는 수단", "국외이전 인증 예외(제4호)는 현재 ISMS-P만 인정(국외이전 고시 별표2). 해외 LLM 사업자의 SOC2, ISO 인증은 근거가 아님", "서비스형 LLM 통화 요약 사례에서 처리방침의 국외이전 고지 누락 지적(결정 제2024-010-184호)"], "change": ["2023. 3. 14. 신설"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제28조의8"}], "clause": "clause:k7", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.1", "verKind": "수정", "clauseName": "개인정보 보호법 제28조의8제1항"}, {"id": "KR-P-16", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제23조제1항·제2항", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제23조(민감정보의 처리 제한) ①개인정보처리자는 사상ㆍ신념, 노동조합ㆍ정당의 가입ㆍ탈퇴, 정치적 견해, 건강, 성생활 등에 관한 정보, 그 밖에 정보주체의 사생활을 현저히 침해할 우려가 있는 개인정보로서 대통령령으로 정하는 정보(이하 “민감정보”라 한다)를 처리하여서는 아니 된다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다.\n1. 정보주체에게 제15조제2항 각 호 또는 제17조제2항 각 호의 사항을 알리고 다른 개인정보의 처리에 대한 동의와 별도로 동의를 받은 경우\n2. 법령에서 민감정보의 처리를 요구하거나 허용하는 경우\n② 개인정보처리자가 제1항 각 호에 따라 민감정보를 처리하는 경우에는 그 민감정보가 분실ㆍ도난ㆍ유출ㆍ위조ㆍ변조 또는 훼손(이하 “유출등”이라 한다)이 되지 아니하도록 제29조에 따른 안전성 확보에 필요한 조치를 하여야 한다.", "req": ["민감정보 처리는 원칙적으로 금지", "예외: 별도 동의 또는 법령 근거", "제29조 안전조치 의무"], "ctx": ["건강정보는 법률 본문에 명시된 민감정보", "의료, 상담 데이터를 LLM에 넣을 때 핵심 조항", "시행령 제18조에서 유전정보, 생체정보 등을 추가"], "change": ["2026. 3. 10. 제2항 개정(시행 2026. 9. 11.)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제23조"}], "clause": "clause:k8", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제23조제1항, 제2항"}, {"id": "KR-P-17", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제33조제1항", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제33조(개인정보 영향평가) ① 공공기관의 장은 대통령령으로 정하는 기준에 해당하는 개인정보파일의 운용으로 인하여 정보주체의 개인정보 침해가 우려되는 경우에는 그 위험요인의 분석과 개선 사항 도출을 위한 평가(이하 “영향평가”라 한다)를 하고 그 결과를 보호위원회에 제출하여야 한다.", "req": ["공공기관 영향평가 의무", "위험요인 분석과 개선 사항 도출", "결과를 보호위원회에 제출"], "ctx": ["공공기관 AI 도입 시 대상 파일이면 영향평가를 먼저 실시", "제11항: 민간은 노력 의무", "민간이 자율로 수행하면 과태료, 과징금 감경 가능(생성형 AI 안내서 각주)"], "change": ["2023. 3. 14. 개정(평가기관 지정 등)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제33조"}], "clause": "clause:k9", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제33조제1항"}, {"id": "KR-P-18", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제37조의2제1항~제4항", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제37조의2(자동화된 결정에 대한 정보주체의 권리 등) ① 정보주체는 완전히 자동화된 시스템(인공지능 기술을 적용한 시스템을 포함한다)으로 개인정보를 처리하여 이루어지는 결정(「행정기본법」 제20조에 따른 행정청의 자동적 처분은 제외하며, 이하 이 조에서 “자동화된 결정”이라 한다)이 자신의 권리 또는 의무에 중대한 영향을 미치는 경우에는 해당 개인정보처리자에 대하여 해당 결정을 거부할 수 있는 권리를 가진다. 다만, 자동화된 결정이 제15조제1항제1호ㆍ제2호 및 제4호에 따라 이루어지는 경우에는 그러하지 아니하다.\n② 정보주체는 개인정보처리자가 자동화된 결정을 한 경우에는 그 결정에 대하여 설명 등을 요구할 수 있다.\n③ 개인정보처리자는 제1항 또는 제2항에 따라 정보주체가 자동화된 결정을 거부하거나 이에 대한 설명 등을 요구한 경우에는 정당한 사유가 없는 한 자동화된 결정을 적용하지 아니하거나 인적 개입에 의한 재처리ㆍ설명 등 필요한 조치를 하여야 한다.\n④ 개인정보처리자는 자동화된 결정의 기준과 절차, 개인정보가 처리되는 방식 등을 정보주체가 쉽게 확인할 수 있도록 공개하여야 한다.", "req": ["중대한 영향을 미치는 결정에 대한 거부권", "설명 요구권", "기준과 절차 공개"], "ctx": ["인공지능 기술을 적용한 시스템도 명시적으로 포함됨", "사람이 최종 판단하는 요약, 질의응답은 보통 해당하지 않음", "자동으로 불이익 처분까지 이어지면 해당할 수 있음"], "change": ["2023. 3. 14. 신설, 2024. 3. 15. 시행"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제37조의2"}], "clause": "clause:k10", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제37조의2, 자동화된 결정 조치 기준"}, {"id": "KR-P-19", "region": "개인정보", "law": "자동화된 결정에 대한 개인정보처리자의 조치 기준(개인정보보호위원회고시 제2024-9호, 2024. 9. 26. 제정)", "article": "제6조(거부ㆍ설명등요구에 대한 조치시 고려사항) 제1항", "type": "고시", "status": "시행", "date": "2024-09-26", "ko": "제6조(거부ㆍ설명등요구에 대한 조치시 고려사항) ① 개인정보처리자는 정보주체의 거부ㆍ설명등요구에 따른 조치를 위하여 완전히 자동화된 시스템으로 이루어지는 결정이 자동화된 결정에 해당하는지 여부를 판단할 때에는 다음 각 호의 사항 및 [별표]의 예시를 모두 고려해야 한다.\n1. 정당한 권한을 가진 사람의 실질적이고 의미 있는 개입 없이 완전히 자동화된 시스템에 의해 결정이 이루어졌는지 여부\n2. 완전히 자동화된 시스템으로 해당 정보주체의 개인정보를 분석ㆍ가공하는 등 개별적인 처리 과정을 거쳐 의미 있는 정보를 추출하는지 여부\n3. 개인정보처리자가 내린 결정으로서 정보주체의 권리 또는 의무에 영향을 미치는 결정인지 여부\n4. 해당 결정이 정보주체의 권리 또는 의무에 영향을 미치는 최종적인 결정에 해당하는지 여부\n5. 완전히 자동화된 시스템에 의한 개인정보의 처리와 결정 사이에 실질적인 관련성이 있는지 여부\n6. 다른 법률에 자동화된 결정에 대한 정보주체의 권리를 규정한 특별한 규정이 있는지 여부", "req": ["실질적인 인적 개입이 있는지 판단", "최종 결정에 해당하는지 판단", "[별표] 예시도 함께 고려"], "ctx": ["고시 정식 명칭은 「자동화된 결정에 대한 개인정보처리자의 조치 기준」", "요청된 「권리 행사 방법 및 절차에 관한 고시」 명칭은 확인되지 않음", "[별표] 예시 본문은 확인하지 못함"], "change": ["재검토기한: 2025. 1. 1. 기준 매 3년(제9조)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/행정규칙/자동화된결정에대한개인정보처리자의조치기준"}], "clause": "clause:k10", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제37조의2, 자동화된 결정 조치 기준"}, {"id": "KR-P-20", "region": "개인정보", "law": "개인정보 보호법(법률 제21445호, 2026. 3. 10. 일부개정)", "article": "제64조의2제6항", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제64조의2(과징금의 부과)\n⑥ 보호위원회는 개인정보 보호를 위하여 예산ㆍ인력ㆍ설비ㆍ장치 등을 투자하고 운영하는 등 대통령령으로 정하는 사유가 있는 경우에는 제1항 및 제2항에 따른 과징금을 감경한다. 다만, 개인정보처리자의 고의 또는 중대한 과실로 위반행위를 한 경우는 제외한다.", "req": ["개인정보 보호 투자, 운영 시 과징금 감경(의무)", "대통령령으로 정하는 사유를 충족한 경우", "고의, 중과실 위반은 제외"], "ctx": ["개정 사실 확인: 법률 제21445호, 2026. 9. 11. 시행", "보호 기술 도입이 감경 요소가 될 수 있음", "제품 도입만으로 감경이 확정된다고 단정하면 안 됨"], "change": ["2026. 3. 10. 신설(시행 2026. 9. 11.)", "같은 개정으로 제2항 가중 과징금(매출 100분의 10) 신설"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법/제64조의2"}], "clause": "clause:k11", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제64조의2제6항 (투자 감경)"}, {"id": "KR-P-21", "region": "개인정보", "law": "개인정보 보호법 시행령(대통령령 제36671호, 2026. 9. 10. 일부개정)", "article": "시행령 제60조의2제5항", "type": "시행령", "status": "시행", "date": "2026-09-11", "ko": "제60조의2(과징금의 산정기준 등)\n⑤ 법 제64조의2제6항 본문에서 “개인정보 보호를 위하여 예산ㆍ인력ㆍ설비ㆍ장치 등을 투자하고 운영하는 등 대통령령으로 정하는 사유가 있는 경우”란 개인정보 보호를 위하여 예산ㆍ인력ㆍ설비ㆍ장치 등을 투자하고 운영하는 경우로서 다음 각 호의 사항을 고려하여 보호위원회가 정하여 고시하는 기준을 충족하는 경우를 말한다.\n1. 개인정보 보호를 위하여 예산ㆍ인력ㆍ설비ㆍ장치 등에 투자한 규모ㆍ비율 및 그 투자의 지속성\n2. 법 제30조의3에 따른 사업주 또는 대표자의 책임 이행 정도\n3. 개인정보 보호책임자의 역할, 조직 및 인력 구성 등 개인정보 보호 체계 운영 내용 및 수준\n4. 그 밖에 개인정보 안전성 확보 조치에 관한 추가적인 노력", "req": ["투자 규모, 비율, 지속성", "대표자의 책임 이행 정도", "안전성 확보를 위한 추가 노력"], "ctx": ["감경 사유를 위임받은 시행령이 2026. 9. 10. 공포됨", "동료 검토서(2026. 8. 5.)의 \"미제정\" 지적은 이후 해소됨", "별표 1의5: 기준금액의 100분의 40 범위에서 감경"], "change": ["2026. 9. 10. 신설(대통령령 제36671호, 시행 2026. 9. 11.)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/개인정보보호법시행령/제60조의2"}], "clause": "clause:k11", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "개인정보 보호법 제64조의2제6항 (투자 감경)"}, {"id": "KR-P-22", "region": "개인정보", "law": "개인정보 보호법 위반에 대한 과징금 부과기준(개인정보보호위원회고시 제2026-12호, 2026. 9. 11. 일부개정)", "article": "제8조의3(투자감경) 제1항", "type": "고시", "status": "시행", "date": "2026-09-11", "ko": "제8조의3(투자감경) ① 다음 각 호의 사항을 종합적으로 고려하여 기준금액의 100분의 40 이하에 해당하는 금액을 감경한다. 다만, 법 제64조의2제6항 단서에 해당하는 경우는 제외한다.\n1. 개인정보 보호를 위하여 예산ㆍ인력ㆍ설비ㆍ장치 등에 투자한 규모ㆍ비율, 그 투자의 지속성, 증가 정도 등이 우수한 경우\n2. 법 제30조의3에 따른 사업주 또는 대표자의 책임 이행 정도, 개인정보 보호책임자의 지정ㆍ권한ㆍ책임 이행 및 업무수행 수준, 인력 구성ㆍ운영 등 개인정보 보호 체계의 운영ㆍ수준이 우수한 경우\n3. 법상 의무사항 이외의 강화된 보호기술의 적용 등 안전성 확보조치 수준이나 노력 등이 우수한 경우", "req": ["기준금액의 100분의 40 이하로 감경", "투자, 보호 체계, 강화된 보호기술을 종합해 고려", "직전 3개 사업연도의 조치가 기준(제2항)"], "ctx": ["제3호 \"법상 의무 이외의 강화된 보호기술\"이 제품과 이어지는 지점", "PIPC 「과징금 투자 감경제도 안내서」(2026. 9.)도 함께 발간", "「과징금 투자 감경제도 안내서」(2026. 9.) 예시에 치환과 마스킹은 직접 열거되지 않음(예시 밖 기술도 고려 가능)"], "change": ["2026. 9. 11. 일부개정(제2026-12호)으로 신설"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/행정규칙/개인정보보호법위반에대한과징금부과기준"}, {"t": "개인정보보호위원회 안내서 게시판(과징금 투자 감경제도 안내서)", "to": "https://www.pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS217&mCode=D010030000&nttId=12468"}], "clause": "clause:k11", "grade": "정부 1차", "verified": "2026-10-07", "en": "", "ver": "v1.1", "verKind": "수정", "clauseName": "개인정보 보호법 제64조의2제6항 (투자 감경)"}, {"id": "KR-P-23", "region": "개인정보", "law": "생성형 인공지능(AI) 개발·활용을 위한 개인정보 처리 안내서(개인정보보호위원회, 2025. 8.)", "article": "Ⅲ. 생성형 AI 개발·활용 단계별 고려사항, 서비스형 LLM(23면)", "type": "가이드라인", "status": "시행", "date": "2025-08-06", "ko": "서비스형 LLM은 주로 기관 간 계약에 따라 API를 통해 데이터를 송수신하는 방식으로 운용되며, 이 과정에서 이용자의 개인정보가 전송되거나 저장되는 경우에는, 라이선스 계약, 이용약관 등을 통해 해당 데이터 처리의 안전성을 확보하는 것이 바람직합니다. 우선, 서비스형 LLM은 개인정보 저장 및 재이용(AI 학습 포함) 배제 규정을 둔 ‘기업용 API 라이선스 (Enterprise API)’를 제공하는 경우가 많습니다. 기업･기관은 이와 같은 보다 높은 수준의 프라이버시 보호를 제공하는 라이선스 이용을 고려할 수 있습니다.", "req": ["라이선스와 약관으로 데이터 처리 안전성 확보", "저장, 재이용을 배제하는 기업용 라이선스 고려"], "ctx": ["개인용 무료 라이선스는 입력이 학습에 쓰일 우려", "같은 면에서 보관, 재이용, 국외이전 사전 검토 권고", "발간일: PIPC 공개 2025. 8. 6.(게시판 등록 8. 22.)"], "change": ["재검토: 발간일로부터 3년마다"], "refs": [ 1.0", "verKind": "", "clauseName": "합성데이터 생성·활용 안내서"}, {"id": "KR-P-33", "region": "개인정보", "law": "개인정보 보호법(법률 제21910호, 2026. 9. 8. 일부개정)", "article": "제28조의12제1항·제2항, 제28조의15", "type": "법률", "status": "시행 예정", "date": "2027-03-09", "ko": "제28조의12(인공지능기술 개발을 위한 개인정보의 이용) ① 개인정보처리자는 인공지능기술 개발(성능 개선을 포함한다. 이하 이 절에서 같다)을 위하여 다음 각 호의 요건을 모두 갖추고 제2항에 따른 보호위원회의 심의ㆍ의결을 거친 경우에는 이 법 또는 다른 법령에 따라 적법하게 수집한 개인정보를 당초 수집한 목적 외로 이용할 수 있다.\n1. 영상, 음성, 이미지, 부호 및 문자 등 처리되는 정보의 특성, 인공지능기술 개발과의 관련성 등을 고려하였을 때 익명 또는 가명으로 처리하여서는 인공지능기술 개발이 어려울 것\n2. 개인정보의 안전한 처리를 위한 기술적ㆍ관리적ㆍ물리적 조치가 된 환경에서 처리하거나 클라우드 환경 등 개별 상황에 따른 추가적 안전조치를 이행하는 등 대통령령으로 정하는 기준에 따른 안전장치를 마련하였을 것\n3. 인공지능기술 개발의 목적이 다음 각 목의 어느 하나를 포함하고 있는 경우로서 정보주체 또는 제3자의 이익을 부당하게 침해할 우려가 현저히 낮을 것\n가. 공공의 이익 증진을 위한 경우\n나. 정보주체 또는 제3자의 이익을 보호하거나 사회적 이익 증진을 위한 경우\n② 개인정보처리자는 제1항에 따라 개인정보를 이용하려는 경우에는 같은 항 각 호의 요건을 갖추었는지 여부에 대하여 보호위원회의 심의ㆍ의결을 받아야 한다. 이 경우 보호위원회는 정보주체의 권리 보장 및 개인정보의 안전한 처리를 위하여 필요한 범위에서 조건을 붙일 수 있다.", "req": ["익명이나 가명으로는 개발이 어려울 것", "대통령령 기준의 안전장치 마련", "공익이나 사회적 이익 목적, 이익 침해 우려가 현저히 낮을 것", "개인정보보호위원회 심의와 의결"], "ctx": ["요건 1호 때문에 가명, 익명, 합성이 먼저라는 점이 법문에 들어감", "Syntitan과 DTS로 가명, 익명, 합성 경로를 먼저 검토했다는 근거를 남기는 데 쓰임", "심의를 거치면 적용 제외 가능 조항: 제18조~제20조, 제20조의2, 제23조, 제24조, 제24조의2, 제25조, 제25조의2, 제28조의8(국외 처리위탁에 한정)(제28조의15)", "하위 시행령이 나오면 기준을 다시 확인", "특례는 한 번 받고 끝나는 허가가 아니라 이행 관리와 처리 제한 규정(제28조의13, 제28조의14)이 함께 적용됨. 고객 안내 문구는 법무 확인 후 사용"], "change": ["2026. 9. 8. 공포(법률 제21910호), 공포 후 6개월인 2027. 3. 9. 시행"], "refs": [{"t": "국가법령정보센터 시행예정본(법률 제21910호, 2027-03-09 시행)", "to": "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=289415&efYd=20270309"}], "clause": "clause:k31", "grade": "정부 1차", "verified": "2026-10-07", "en": "", "ver": "v1.2", "verKind": "수정", "clauseName": "개인정보 보호법 제28조의12~제28조의15 (AI 개발 특례)"}, {"id": "KR-A-01", "region": "AI", "law": "인공지능 발전과 신뢰 기반 조성 등에 관한 기본법 (법률 제21311호)", "article": "제2조제4호", "type": "법률", "status": "시행", "date": "2026-01-22", "ko": "4. “고영향 인공지능”이란 사람의 생명, 신체의 안전 및 기본권에 중대한 영향을 미치거나 위험을 초래할 우려가 있는 인공지능시스템으로 하거나 대출 심사 개별 단계를 종합하여 최종 결정을 하는 경우 ‘고영향 인공지능’에 해당하며, 대출 심사에 차별적 데이터 또는 민감한 데이터를 사용하는 경우에도 ‘고영향 인공지능’에 해당한다. 한편, 의사 결정 과정에서 그 결과를 단순 참고하는 경우에는 ‘고영향 인공지능’에 해당하지 않는다.\n(2.3 보건의료 이용체계) 인공지능을 통해 보건의료적 판단(최종 결정이 아니더라도 보건의료인의 판단을 유사하게 수행하여 의사결정에 영향을 미치는 경우를 포함)에 해당하는 기능을 구현하는 경우로서 서비스 대상자의 생명·신체·정신에 중대한 피해가 발생할 우려가 있는 경우 ‘고영향’에 해당한다.", "req": ["법정 영역에서 쓰이는지(1단계)와 영향의 중대성을 함께 판단", "대출심사는 중간 단계 결정이나 민감 데이터 사용도 고영향(점수표로 판정)", "결과를 단순 참고만 하면 고영향이 아님"], "ctx": ["사람이 개입한다는 이유만으로 제외되지 않음", "보건의료는 최종 결정이 아니어도 보건의료인 판단을 유사하게 수행하면 고영향", "금융 고객이 '사람이 결재하니 제외'로 오판하지 않도록 안내"], "change": ["2026-01-22 최초 게시, 2026-04-29 수정본(NIA)"], "refs": [{"t": "한국지능정보사회진흥원 공지(2026-01-22, 가이드라인 첨부)", "to": "https://nia.or.kr/site/nia_kor/ex/bbs/View.do?cbIdx=99835&bcIdx=28987&parentSeq=28987"}, {"t": "고영향 인공지능 판단 가이드라인 PDF(NIA, 2026-04-29판)", "to": "https://www.nia.or.kr/common/board/Download.do?bcIdx=28987&cbIdx=99835&fileNo=27"}, {"t": "대한민국 정책브리핑(과기정통부, 2026-01-21)", "to": "https://www.korea.kr/news/policyNewsView.do?newsId=148958380"}], "clause": "clause:k15", "grade": "정부 1차", "verified": "2026-10-07", "en": "", "ver": "v1.1", "verKind": "수정", "clauseName": "AI 기본법 제2조제4호, 제33조, 시행령 제25조"}, {"id": "KR-F-01", "region": "금융", "law": "전자금융감독규정(금융위원회고시 제2026-29호, 2026. 7. 15. 일부개정)", "article": "제15조제1항제3호", "type": "감독규정", "status": "시행", "date": "2026-07-15", "ko": "제15조(해킹 등 방지대책) ① 금융회사 또는 전자금융업자는 정보처리시스템 및 정보통신망을 해킹 등 전자적 침해행위로부터 방지하기 위하여 다음 각 호의 대책을 수립ㆍ운용하여야 한다. … 3. 내부통신망과 연결된 내부 업무용시스템은 인터넷(무선통신망 포함) 등 외부통신망과 분리ㆍ차단 및 접속 금지. 다만, 다음 각 목의 경우에는 그러하지 아니하다. 가. 이용자의 고유식별정보 또는 개인신용정보(「신용정보의 이용 및 보호에 관한 법률」 제40조의2에 따른 가명처리에 관한 행위규칙을 준수한 가명정보는 제외)를 처리하지 않는 연구ㆍ개발 목적의 경우(단, … 금융감독원장이 정한 망분리 대체 정보보호통제를 적용하고 정보보호위원회가 승인한 경우에 한한다) 나. 업무상 불가피한 경우로서 금융감독원장의 확인을 받은 경우", "req": ["내부 업무망을 외부통신망과 분리, 차단", "연구, 개발 예외는 가명정보만 허용", "예외 적용 시 대체 정보보호통제와 승인 필요"], "ctx": ["외부 생성형 AI 연결은 원칙상 망분리 위반", "현행 문언에 생성형 AI 예외 조항은 없음", "가명정보는 R&D 망 예외에서 처리 가능", "실무상 도입은 SaaS 예외, 혁신금융서비스, 보안목적 긴급완화 가운데 하나를 거침"], "change": ["2024-08-1 eq": ["인구통계 특성별로 데이터 편향 정기 분석", "편향이 탐지되면 개선 조치", "위험평가와 통제 전 과정 문서화"], "ctx": ["대출심사, 신용평가 모델은 편향 지표 필수", "위험이 낮은 사내 업무용 AI는 통제 완화 가능", "편향 보정용 데이터 보강 수요로 이어짐", "세부 통제는 금감원 AI RMF 참조"], "change": ["2026-06-22 시행(개정판). 구체적인 위험통제 예시는 금감원 AI RMF로 위임"], "refs": [{"t": "금융위원회 보도자료(2026. 6. 18.) 및 가이드라인 전문", "to": "https://www.fsc.go.kr/no010101/87142"}], "clause": "clause:k20", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "금융분야 인공지능 가이드라인 (2026. 6.)"}, {"id": "KR-F-05", "region": "금융", "law": "금융위원회 「금융분야 인공지능 가이드라인」(2026. 6.)", "article": "7. 보안성 원칙 — 망분리 대체 정보보호통제(보안 목적 AI·SaaS), 점검 항목 ⑦", "type": "가이드라인", "status": "시행", "date": "2026-06-22", "ko": "금융회사등은 보안 등의 목적을 위해 인공지능을 활용하는 과정에서 망분리를 완화할 경우, 보안상 취약점 등이 발생하지 않도록 아래와 같은 망분리 대체 통제를 적용한다. … ✓ 생성형 AI 서비스의 경우 유료 비즈니스 등 관리형 버전 이용(미학습 약정 필수) … ✓ 개인신용정보, 고유식별정보 등 중요정보 입력ㆍ처리ㆍ외부전송ㆍ유출 여부 모니터링 및 통제 … ✓ 접속ㆍ이용 내역, 관리자 활동, 이상행위 등에 대한 모니터링 및 로그 수집(1년 이상 보존) / ⑦ 입출력 데이터에서 목적 외 고유식별정보 및 개인(신용)정보 포함 여부를 탐지하고 마스킹 또는 차단하는 기능을 구현했는가?", "req": ["관리형 생성형 AI 사용과 미학습 약정", "중요정보 입력과 외부 전송 모니터링", "입출력의 개인(신용)정보 탐지, 마스킹"], "ctx": ["LLM 입출력 마스킹이 점검 항목에 명시", "프롬프트 치환, 복원 제품의 직접 근거", "로그 1년 이상 보존 요구와 연결됨", "대체통제 목록은 보안 목적 AI와 SaaS 기준"], "change": ["2026-05-22 보안목적 AI 망분리 한시 완화 발표에 이어 가이드라인에 대체통제 수록"], "refs": [{"t": "금융위원회 보도자료(2026. 6. 18.) 및 가이드라인 전문", "to": "https://www.fsc.go.kr/no010101/87142"}], "clause": "clause:k19", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "전자금융감독규정 제15조제1항제3호, 망분리 개선 로드맵"}, {"id": "KR-F-06", "region": "금융", "law": "신용정보의 이용 및 보호에 관한 법률(법률 제21445호, 2026. 3. 10. 타법개정)", "article": "제36조의2", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제36조의2(자동화평가 결과에 대한 설명 및 이의제기 등) ① 개인인 신용정보주체는 개인신용평가회사 및 대통령령으로 정하는 신용정보제공ㆍ이용자(이하 이 조에서 “개인신용평가회사등”이라 한다)에 대하여 다음 각 호의 사항을 설명하여 줄 것을 요구할 수 있다. 1. 다음 각 목의 행위에 자동화평가를 하는지 여부 가. 개인신용평가 … 2. 자동화평가를 하는 경우 다음 각 목의 사항 가. 자동화평가의 결과 나. 자동화평가의 주요 기준 다. 자동화평가에 이용된 기초정보(이하 이 조에서 “기초정보”라 한다)의 개요 … ② … 2. 자동화평가에 이용된 기초정보의 내용이 정확하지 아니하거나 최신의 정보가 아니라고 판단되는 경우 … 가. 기초정보를 정정하거나 삭제할 것을 요구하는 행위 나. 자동화평가 결과를 다시 산출할 것을 요구하는 행위", "req": ["자동화평가 여부, 결과, 주요 기준 설명", "기초정보의 개요 설명", "정정, 삭제, 재산출 요구에 대응"], "ctx": ["AI 신용평가, 여신 결정에 설명 의무", "학습 데이터와 입력 데이터의 출처 관리가 전제", "가명정보에는 적용 제외(제40조의3)"], "change": ["2020-02-04 신설(2020. 8. 5. 시행), 이후 본조 개정 없음(현행 2026. 9. 11. 시행본 기준)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/신용정보의이용및보호에관한법률/제36조의2"}], "clause": "clause:k21", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "신용정보법 제36조의2"}, {"id": "KR-F-07", "region": "금융", "law": "신용정보의 이용 및 보호에 관한 법률(법률 제21445호, 2026. 3. 10. 타법개정)", "article": "제40조의2제1항·제2항·제6항·제7항·제8항", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "제40조의2(가명처리ㆍ익명처리에 관한 행위규칙) ① 신용정보회사등은 가명처리에 사용한 추가정보를 대통령령으로 정하는 방법으로 분리하여 보관하거나 삭제하여야 한다. ② 신용정보회사등은 가명처리한 개인신용정보에 대하여 … 내부관리계획을 수립하고 접속기록을 보관하는 등 … 기술적ㆍ물리적ㆍ관리적 보안대책을 수립ㆍ시행하여야 한다. … ⑥ 신용정보회사등은 영리 또는 부정한 목적으로 특정 개인을 알아볼 수 있게 가명정보를 처리하여서는 아니 된다. ⑦ … 특정 개인을 알아볼 수 있게 된 경우 즉시 그 가명정보를 회수하여 처리를 중지하고 … 즉시 삭제하여야 한다. ⑧ … 가명처리나 익명처리를 한 경우 … 조치 기록을 3년간 보존하여야 한다.", "req": ["추가정보 분리 보관, 삭제", "가명정보 보안대책과 접속기록", "가명처리, 익명처리 기록 3년 보존"], "ctx": ["망분리 R&D 예외의 전제 조건(감독규정 제15조)", "치환 매핑표는 '추가정보'로 분리 관리", "익명처리가 적정한지 금융위에 심사 요청 가능(③④)"], "change": ["2020-02-04 신설. 2026. 6. 18. 금융위 '가명처리 등 관련 규제 정비' 언급(개정안 미확인)"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/신용정보의이용및보호에관한법률/제40조의2"}, {"t": "금융위원회 보도자료(2026. 6. 18.)", "to": "https://www.fsc.go.kr/no010101/87142"}], "clause": "clause:k22", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "신용정보법 제40조의2, 제32조제6항제9호의2"}, {"id": "KR-F-08", "region": "금융", "law": "신용정보의 이용 및 보호에 관한 법률(법률 제21445호, 2026. 3. 10. 타법개정)", "article": "제32조제6항제9호의2", "type": "법률", "status": "시행", "date": "2026-09-11", "ko": "9의2. 통계작성, 연구, 공익적 기록보존 등을 위하여 가명정보를 제공하는 경우. 이 경우 통계작성에는 시장조사 등 상업적 목적의 통계작성을 포함하며, 연구에는 산업 /제19조"}], "clause": "clause:k23", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.1", "verKind": "수정", "clauseName": "의료법 제19조, 제21조제2항, 제23조, 전자의무기록 시설 장비 기준"}, {"id": "KR-M-02", "region": "의료", "law": "의료법(법률 제21490호, 2026. 3. 24. 타법개정)", "article": "제21조제2항", "type": "법률", "status": "시행", "date": "2026-10-02", "ko": "②의료인, 의료기관의 장 및 의료기관 종사자는 환자가 아닌 다른 사람에게 환자에 관한 기록을 열람하게 하거나 그 사본을 내주는 등 내용을 확인할 수 있게 하여서는 아니 된다.", "req": ["환자가 아닌 제3자의 기록 열람 금지", "예외는 제3항 열거 사유뿐"], "ctx": ["AI 공급자, 메신저 사업자는 열거된 예외에 없음", "수탁자의 '다른 사람' 해당 여부 유권해석 필요", "제3항 예외 목록은 2026. 4. 7.까지 개정"], "change": ["2009-01-30, 2016-12-20 개정, 제3항은 2026-04-07 최종 개정"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/의료법/제21조"}], "clause": "clause:k23", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "의료법 제19조, 제21조제2항, 제23조, 전자의무기록 시설 장비 기준"}, {"id": "KR-M-03", "region": "의료", "law": "의료법(법률 제21490호, 2026. 3. 24. 타법개정)", "article": "제23조제2항·제3항", "type": "법률", "status": "시행", "date": "2026-10-02", "ko": "제23조(전자의무기록) ①의료인이나 의료기관 개설자는 제22조의 규정에도 불구하고 진료기록부등을 「전자서명법」에 따른 전자서명이 기재된 전자문서(이하 “전자의무기록”이라 한다)로 작성ㆍ보관할 수 있다. ②의료인이나 의료기관 개설자는 보건복지부령으로 정하는 바에 따라 전자의무기록을 안전하게 관리ㆍ보존하는 데에 필요한 시설과 장비를 갖추어야 한다. ③누구든지 정당한 사유 없이 전자의무기록에 저장된 개인정보를 탐지하거나 누출ㆍ변조 또는 훼손하여서는 아니 된다.", "req": ["EMR 관리, 보존에 필요한 시설과 장비 구비", "EMR에 저장된 개인정보 탐지, 누출 금지"], "ctx": ["EMR과 연동하는 AI는 시설, 장비 기준(고시) 적용", "'누구든지' 규정이라 공급사도 수범자", "시설 기준은 보건복지부고시로 위임"], "change": ["2026-06-09 개정: 제4항 접속기록 보관 대상에 '기재·열람' 추가, 시행 2026-12-10"], "refs": [{"t": "국가법령정보센터", "to": "https://www.law.go.kr/법령/의료법/제23조"}], "clause": "clause:k23", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "의료법 제19조, 제21조제2항, 제23조, 전자의무기록 시설 장비 기준"}, {"id": "KR-M-04", "region": "의료", "law": "전자의무기록의 관리·보존에 필요한 시설과 장비에 관한 기준(보건복지부고시 제2023-245호, 2023. 12. 14. 일부개정)", "article": "제7조, 별표 1·별표 2 4.3", "type": "고시", "status": "시행", "date": "2023-12-14", "ko": "제7조(의료기관 0-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "생명윤리법 제15조, 시행규칙 제13조"}, {"id": "KR-M-08", "region": "의료", "law": "보건복지부·개인정보보호위원회·한국보건의료정보원 「보건의료데이터 활용 가이드라인」(2025. 12.)", "article": "부록 3 가명정보 처리 관련 생명윤리법 유권해석", "type": "가이드라인", "status": "시행", "date": "2025-12-31", "ko": "다만, 업무 목적으로 수집한 개인정보를 2차적으로 이용하는 연구에 대한 정보주체의 동의 면제가 해당 연구에 대한 기관위원회 심의 또는 심의면제 확인을 갈음하는 것은 아님 … 가명처리 확인 등 데이터심의위원회 승인을 받은 과제는 해당 서류*를 확인할 수 있는 경우 7일 이내에 심의면제 확인서 발급 가능 * 예시) 데이터심의위원회 승인서 등 해당 정보가 가명 정보 형태로 제공된다는 근거 서류", "req": ["동의 면제가 IRB 심의나 심의면제 확인을 대신하지 않음", "DRB 승인 과제는 서류를 확인하면 7일 안에 심의면제 확인서 발급 가능"], "ctx": ["2020. 9. 판의 '가명처리는 익명화에 포함' 문장은 2025. 12. 판에서 빠짐", "면제는 자동이 아니라 IRB가 확인할 사항"], "change": ["2020-08-04 생명윤리정책과 유권해석(2020. 9. 판 수록) → 2025. 12. 판에서 부록 3 전면 교체"], "refs": [{"t": "개인정보보호위원회 안내서 게시판: 보건의료데이터 활용 가이드라인(2025.12.)", "to": "https://www.pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS217&mCode=D010030000&nttId=12183"}], "clause": "clause:k25", "grade": "정부 1차", "verified": "2026-10-07", "en": "", "ver": "v1.2", "verKind": "수정", "clauseName": "생명윤리법 제15조, 시행규칙 제13조"}, {"id": "KR-G-01", "region": "공공", "law": "국가 망 보안체계(N²SF) 보안 가이드라인 (국가정보원, 1.0 정식판)", "article": "본책 등급분류와 보안원칙, 업무환경에서 생성형 AI 활용 예시(p.48~49)", "type": "가이드라인", "status": "시행", "date": "2025-09", "ko": "(본책 p.48, 업무환경에서 생성형 AI 활용 예시) 생성형 AI 서비스(O등급)에서 S등급 업무정보가 생산·저장되는 위협을 발견할 수 있으며, 이를 해결하기 위해서는 생성형 AI 서비스➍에서 O등급 업무정보만 취급하도록 하는 보안통제가 필요함을 알 수 있다.\n(본책 p.49) 이를 해결하기 위해서는 업무단말➊과 온북➋에서 S등급 업무정보의 업로드를 차단하고 연계구간➌에서 이를 필터링하는 등의 보안통제가 필요함을 알 수 있다.", "req": ["업무정보를 C, S, O 등급으로 분류", "등급별 차등 보안통제", "생성형 AI 서비스에는 O등급 업무정보만 취급"], "ctx": ["망분리를 일률 적용하는 대신 등급에 따라 외부 AI와 클라우드 허용", "연계구간에서 필터링하는 보안통제가 LLM Capsule의 위치를 설명(p.49)", "S등급을 활용하려면 보안통제 충족이 조건", "세부 항목 수와 모델 종수는 부록 확인 전까지 표기하지 않음", "\"N2SF 인증\"이라는 표현은 쓰지 않음"], "change": ["2025-01-23 드래프트 배포", "2025-09 1.0 정식판(본책과 부록 2권, 공개 보도 2025-09-30)", "2026-09 클라우드 등급을 C, S, O로 정렬한다고 발표(언론, 검증 필요)"], "refs": [{"t": "국가사이버안보센터(문서 공개 링크 없음)", "to": "https://www.ncsc.go.kr/"}, {"t": "언론: 바이라인네트워크(2026-09-18)", "to": "https://byline.network/2026/09/18-635/"}], "clause": "clause:k26", "grade": "정부 1차(공개 링크 없음) · 언론 1건", "verified": "2026-10-07", "en": "", "ver": "v1.2", "verKind": "수정", "clauseName": "국가 망 보안체계(N2SF) 보안 가이드라인, 국가 사이버보안 기본지침"}, {"id": "KR-G-02", "region": "공공", "law": "국가 사이버보안 기본지침 (국가정보원, 2026. 5. 1. 일부개정)", "article": "제66조제4항, 제69조, 제3장 제1절(국가망보안체계)", "type": "지침", "status": "시행", "date": "2026-05-01", "ko": "제66조(기밀ㆍ민감등급 업무정보 처리) ④ 공무원등은 제3항제5호 및 제6호에 해당하는 경우를 제외하고는 ｢정보통신망 이용촉진 및 정보보호 등에 관한 법률｣ 제2조제1항제2호에 따른 정보통신서비스(전자우편ㆍ메신저 등을 포함한다) 및 인공지능을 활용한 상용 정보통신서비스 또는 국외에서 제공하는 이와 유사한 서비스(이하 “상용 정보통신서비스”라 한다)를 이용하여 기밀(비밀을 제외한다)ㆍ민감등급 업무정보를 작성, 저장, 수ㆍ발신하여서는 아니 된다.\n제69조(공개등급 업무정보 처리) 공무원등은 관계 법규에 위배되지 않는 범위 내에서 인터넷 PC나 개인이 소유한 PCㆍ휴대용 저장매체ㆍ휴대폰(…), 상용 정보통신서비스(…) 등을 이용하여 공개등급 업무정보를 처리할 수 있다.", "req": ["지침에 N2SF 명시", "내부망과 인터넷망 분리 조항 삭제", "등급이 다른 도메인 간 통신은 차단하거나 분리할 수 있음(제39조의5②). CDS 의무는 제어시스템과 사물인터넷 조항(제53조의2, 제58조)에 한정"], "ctx": ["망분리가 의무에서 등급별 선택 통제로 바뀜", "외부 생성형 AI 도입 논리의 상위 근거", "2026-05-01 일부개정(전부개정 아님): 제3장 제1절 N2SF 신설, 제40조 삭제 확인", "제66조④에도 예외가 있음(제3항제5호 영상회의 화면 공유용 일시 저장, 제6호 긴급 시 기관장 인정)", "교육현장은 제66조①~⑤ 적용 제외(⑥). 교육현장은 국공립 초중고, 국공립대의 교육 목적 정보통신환경, 특정연구기관 부설 학교(제2조제5호의2)이며 교육청 행정망은 포함되지 않음"], "change": ["2026-05-01 일부개정(전부개정 아님): 제3장 제1절 N2SF 신설, 제40조 삭제, 제66조④에 AI 상용 서비스 명시"], "refs": [{"t": "국가정보원 국가사이버안보센터(문서 공개 링크 없음)", "to": "https://www.ncsc.go.kr/"}], "clause": "clause:k26", "grade": "정부 1차(공개 링크 없음)", "verified": "2026-10-07", "en": "", "ver": "v1.2", "verKind": "수정", "clauseName": "국가 망 보안체계(N2SF) 보안 가이드라인, 국가 사이버보안 기본지침"}, {"id": "KR-G-03", "region": "공공", "law": "공공부문 AI 도입·활용 가이드 (행정안전부·한국지능정보사회진흥원, 2026. 5.)", "article": "Ⅱ.1 계획 수립 시 고려사항, Ⅱ.2 도입 절차(보안 등급 설정)", "type": "가이드라인", "status": "시행", "date": "2026-05-29", "ko": "도입 대상 업무 데이터가 공개정보(O) 등급인 경우에는 민간 클라우드 기반의 AI 서비스 활용이 가능하다.", "req": ["범정부 AI 공통기반 우선 이용(노력 의무)", "공개(O) 등급 업무 데이터는 민간 클라우드 기반 AI 서비스 활용 가능", "데이터 보안 등급은 이용 기관이 직접 분류"], "ctx": ["공통기반에 PII Masking(주민등록번호, 운전면허번호, 여권번호, 휴대전화번호 4종)과 Security Filter가 들어 있음", "LLM Capsule은 복원, 비정형 문서, 이름과 주소 같은 넓은 유형, 설치형으로 구분해 설명", "본문에 개인정보 입력 금지 문구는 없음(입력 제한 근거는 기본지침 제66조④)"], "change": ["2026-05 발간, 2026-06-10 배포 보도", "2026-08-28 인공지능데이터행정법 제27조 시행과 연동"], "refs": [{"t": "행정안전부 보도자료(KDI 경제정보센터 게재)", "to": "https://eiec.kdi.re.kr/policy/materialView.do?num=282444"}], "clause": "clause:k27", "grade": "정부 1차", "verified": "2026-10-07", "en": "", "ver": "v1.1", "verKind": "수정", "clauseName": "공공부문 AI 도입·활용 가이드, AI보안 가이드북, 공공 AX 프라이버시 보호 안내서"}, {"id": "KR-G-05", "region": "공공", "law": "국가·공공기관 AI보안 가이드북 (국가정보원, 2025-12-10, 2.0)", "article": "구축 유형별 보안대책: 내부업무용 AI시스템의 외부망 연계", "type": "가이드라인", "status": "시행", "date": "2025-12-10", "ko": "본 가이드북에서는 각급기관이 위협을 예방하고 안전하게 AI를 도입 · 활용하는데 초점을 맞추어, 실무 현장에서 고려해야 할 15개 보안위협 유형을 식별하고 이에 대한 30개 보안대책을 도출하였다. 특히 실제 직면하는 AI시스템 구축 유형을 ‘내부업무용 AI시스템의 외부망 연계’ 등 3가지로 분류하여, 각각에 대한 중점 보안대책을 제시한다.", "req": ["15개 보안위협 유형과 30개 보안대책", "AI시스템 구축 유형 3가지별 중점 보안대책", "내부업무용 AI시스템을 외부망과 연계할 때의 보안대책"], "ctx": ["2023년 「챗GPT 등 생성형 AI 활용 보안 가이드라인」(1.0)의 개정판(2.0)", "구축 유형 가운데 내부업무용 AI시스템의 외부망 연계가 사례 08 구조와 같음", "별도 폐지 공지는 없음(문서이력 기준)"], "change": ["2023-06 1.0 「챗GPT 등 생성형 AI 활용 보안 가이드라인」에서 2025-12 2.0으로 개정(문서이력 기준)"], "refs": [{"t": "국가정보원(문서 공개 링크 없음)", "to": "https://www.nis.go.kr/"}], "clause": "clause:k27", "grade": "정부 1차(공개 링크 없음)", "verified": "2026-10-07", "en": "", "ver": "v1.2", "verKind": "수정", "clauseName": "공공부문 AI 도입·활용 가이드, AI보안 가이드북, 공공 AX 프라이버시 보호 안내서"}, {"id": "KR-G-06", "region": "공공", "law": "공공데이터의 인공지능 친화적 관리 가이드라인 v1.1 (행정안전부·한국지능정보사회진흥원)", "article": "FAIR 원칙 03·04·07, 3.1 데이터 생애주기 및 이력 관리", "type": "가이드라인", "status": "시행", "date": "2026-07-31", "ko": "원칙 03 데이터의 구조와 의미를 설명하는 포괄적이고 기계가 이해 가능한 메타데이터를 제공하여야 한다. 원칙 04 데이터 구조, 활용 목적, 편향성 및 한계점, 버전 및 변경 이력을 투명하게 문서화하고 공개하여야 한다. … 원칙 07 데이터 생애주기 단계별 관리정보와 출처·이력을 기록하여 AI 활용에 필요한 데이터 신뢰성과 추적성을 확보하여야 한다.", "req": ["기계가 이해할 수 있는 메타데이터", "버전과 변경 이력 문서화", "출처와 이력 기록, 추적성 확보"], "ctx": ["개방 데이터를 AI에 바로 쓸 수 있는 상태로 관리하도록 요구", "품질 지표 6종(완전성, 정확성 등)을 따로 제시", "부록3 자가진단 체크리스트 제공, 평가편람 등 기존 매뉴얼과 연계", "법적 강제력이 없는 권고 문서"], "change": ["2026-03-31 V1.0 최초 발간", "2026-07-31 V1.1(생애주기, AI 에이전트 대응)", "2026-09-11 공공데이터포털 자료실 게시"], "refs": [{"t": "공공데이터포털", "to": "https://www.data.go.kr/bbs/rcr/selectRecsroom.do?originId=PDS_0000000001269&atchFileId=FILE_000000007668860"}], "clause": "clause:k28", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.1", "verKind": "수정", "clauseName": "공공데이터의 인공지능 친화적 관리 가이드라인 v1.1"}, {"id": "KR-G-07", "region": "공공", "law": "공공데이터의 인공지능 친화적 관리 가이드라인 v1.1 (행정안전부·한국지능정보사회진흥원)", "article": "1.3.2 공유 데이터 자격 기준", "type": "가이드라인", "status": "시행", "date": "2026-07-31", "ko": "데이터의 등급 분류는 향후 국정원의 보안 가이드라인(N2SF) 기준에 따라 변경 가능 … 1등급(O) 공개공유 개인정보 및 보안상 문제가 없음 … 2등급(S) 제한공유 비식별 처리를 통해 안전성 확보 … 3등급(C) 내부전용 비식별 처리 후라도 보안상 외부 공유 부적절 … 재식별 위험 잔존: 비식별 처리를 수행하였음에도 불구하고 기술적으로 개인 식별 가능성이 남아있는 경우", "req": ["공유 전에 O, S, C 3단계로 등급 분류", "S등급은 비식별 처리가 전제", "재식별 위험이 남아 있으면 공유 제한"], "ctx": ["N2SF 등급과 데이터 개방을 잇는 고리", "비식별 처리와 재식별 위험 점검이 공유 조건", "등급표는 원문상 \"예시\"이며 의무 아님"], "change": ["V1.1(2026-07-31) 기준"], "refs": [{"t": "공공데이터포털", "to": "https://www.data.go.kr/bbs/rcr/selectRecsroom.do?originId=PDS_0000000001269&atchFileId=FILE_000000007668860"}], "clause": "clause:k28", "grade": "정부 1차", "verified": "2026-10-06", "en": "", "ver": "v1.0", "verKind": "", "clauseName": "공공데이터의 인공지능 친화적 관리 가이드라인 v1.1"}, {"id": "KR-G-08", "region": "공공", "law": "공공데이터의 제공 및 이용 활성화에 관한 법률 (인공지능데이터행정법 법률 제21392호에 따른 타법개정, 2026-08-28 시행)", "article": "제22조(공공데이터의 품질관리)", "type": "법률", "status": "시행", "date": "2026-08-28", "ko": "① 공공기관의 장은 해당 기관이 생성 또는 취득하여 관리하는 공공데이터의 안정적 품질관리 및 적정한 품질수준의 확보를 위하여 필요한 조치를 취하여야 한다. ② 과학기술정보통신부장관과 행정안전부장관은 공공데이터의 적정한 품질수준의 확보와 제공 촉진을 위하여 품질 진단ㆍ평가, 개선지원 등 필요한 시책을 수립ㆍ추진하여야 한다.", "req": ["기관장의 품질관리 조치 의무", "정부의 품질 진단, 평가, 개선 지원"], "ctx": ["개방 데이터 품질은 기관장의 법적 의무", "품질 진단, 평가 결과 공표 가능(제3항)", "제22조 자체는 2017년 이후 변경 없음"], "change": ["2026-08-28 시행 개정은 전 /* search haystack in both languages */
const HAY = new WeakMap();
function hayOf(o){
  if(HAY.has(o)) return HAY.get(o);
  const out=[]; (function walk(v){ if(typeof v==='string'){ out.push(v); if(EN[v]) out.push(EN[v]); } else if(Array.isArray(v)) v.forEach(walk); else if(v && typeof v==='object') Object.values(v).forEach(walk); })(o);
  const h = out.join(' \n ').toLowerCase(); HAY.set(o,h); return h;
}
const words = q => q.trim().toLowerCase().split(/\s+/).filter(Boolean);
const hits = (o, ws) => { const h = hayOf(o); return ws.every(w=>h.includes(w)); };

/* ---------- global search ---------- */
function search(q){
  const ws = words(q);
  if(!ws.length) return '';
  const groups = [
    [L('고객 상황','Customer situations'), DATA.cases, c=>[`#case-${c.id}`, `${c.id} · ${tr(c.customer)}`, tr(c.sector)]],
    [L('제품 기능','Product features'), DATA.features, f=>[`#feat-${f.id}`, tr(f.name), f.product]],
    [L('조항','Clauses'), DATA.clauses, c=>[`#clause-${c.id}`, tr(c.name), tr(c.req[0]||'')]],
    [L('원문','Sources'), DATA.sources, s=>[`#src-${s.id}`, `${s.id} · ${tr(s.article)}`, tr(s.law)]],
  ].map(([t,arr,fn])=>[t,arr.filter(o=>hits(o,ws)),fn]);
  const html = groups.filter(g=>g[1].length).map(([t,arr,fn],gi)=>`<h4>${t} ${arr.length}</h4>${arr.slice(0,5).map(x=>{const [h,a,b]=fn(x);return `<a href="${h}">${esc(a)}<small>${esc(b)}</small></a>`;}).join('')}${arr===groups[3][1]&&arr.length>5?`<a href="#sources" data-sq="${esc(q)}"><b>${L(`원문 ${arr.length}건 모두 보기 →`,`See all ${arr.length} source texts →`)}</b></a>`:''}`).join('');
  return html || `<div class="none">${L('검색 결과가 없습니다. 다른 조항명이나 키워드로 찾아보세요.','No results. Try another clause name or keyword.')}</div>`;
}

/* ---------- routing ---------- */
let io;
function route(keepScroll){
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  let html, view = h, target = null;
  if(h.startsWith('case-')){ html = pageCase(h.slice(5)); view='cases'; }
  else if(h.startsWith('clause-')){ html = pageClause(h.slice(7)); view='clauses'; }
  else if(h.startsWith('src-')){ html = pageSource(h.slice(4)); view='sources'; }
  else if(h.startsWith('feat-') || h.startsWith('p-')){ html = pageProducts(); view='products'; target=h; }
  else html = ({home:pageHome, cases:pageCases, products:pageProducts, clauses:pageClauses, sources:pageSources}[h] || pageHome)();
  const y = window.scrollY;
  $('#app').innerHTML = html;
  renderChrome(view);
  $('#results').hidden = true;
  if(keepScroll){ window.scrollTo(0,y); }
  else {
    const el = target && document.getElementById(target);
    if(el){ el.scrollIntoView({block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    else window.scrollTo(0,0);
  }
  setupToc();
}
function setupToc(){
  if(io) io.disconnect();
  const tocEl = $('#toc'); if(!tocEl || !('IntersectionObserver' in window)) return;
  const links = [...tocEl.querySelectorAll('a[data-jump]')];
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ links.forEach(a=>a.classList.toggle('on', a.dataset.jump===e.target.id)); } });
  }, {rootMargin:'-100px 0px -60% 0px'});
  links.forEach(a=>{ const t=document.getElementById(a.dataset.jump); if(t) io.observe(t); });
}

document.addEventListener('click', e=>{
  const lg = e.target.closest('[data-lang]');
  if(lg){ LANG = lg.dataset.lang; try{ localStorage.setItem('ukeu-lang', LANG); }catch(_){} route(true); return; }
  const j = e.target.closest('[data-jump]');
  if(j){ e.preventDefault(); const el=document.getElementById(j.dataset.jump); if(el) el.scrollIntoView({block:'start', behavior:'smooth'}); return; }
  const rs = e.target.closest('[data-reset]');
  if(rs){ rs.dataset.reset.split(',').forEach(k=>{ if(k==='sq') st.sq=''; else st.f[k] = ['region','status','stype','law','uver'].includes(k) ? '' : null; }); saveF(); route(true); return; }
  const sq = e.target.closest('[data-sq]');
  if(sq){ st.sq = sq.dataset.sq; ['region','status','stype','law','uver'].forEach(k=>st.f[k]=''); }
  const a = e.target.closest('a[href^="#"]');
  if(a && a.getAttribute('href')===location.hash){ e.preventDefault(); route(); return; }
  const c = e.target.closest('.chip[data-f]');
  if(c){ st.f[c.dataset.f] = c.dataset.v || null; saveF(); route(true); return; }
  if(!e.target.closest('.gsearch')) $('#results').hidden = true;
});
document.addEventListener('change', e=>{
  const m = /^f-(region|status|stype|law|uver)$/.exec(e.target.id||'');
  if(m){ st.f[m[1]] = e.target.value; saveF(); route(true); }
});
let t1;
document.addEventListener('input', e=>{
  if(e.target.id==='sq'){ clearTimeout(t1); t1=setTimeout(()=>{ st.sq=e.target.value; $('#slistWrap').innerHTML = sourceList(); },120); }
  if(e.target.id==='gq'){ const r=$('#results'); const html=search(e.target.value); r.innerHTML=html; r.hidden=!html; }
});
$('#gq').addEventListener('focus', e=>{ if(e.target.value.trim()) $('#results').hidden=false; });
$('#gq').addEventListener('keydown', e=>{ if(e.key==='Escape'){ $('#results').hidden=true; e.target.blur(); } if(e.key==='Enter'){ const a=$('#results a'); if(a) location.hash=a.getAttribute('href'); } });
window.addEventListener('hashchange', ()=>route());
route();
</script>
